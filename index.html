<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GabyStudio · Reservas</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#fff8fb;
      color:#2b2026;
    }

    .wrap{
      max-width:720px;
      margin:auto;
      padding:30px 18px;
    }

    .card{
      background:#ffffff;
      border-radius:20px;
      padding:24px;
      box-shadow:0 8px 30px rgba(50,20,35,.08);
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
    }

    .intro{
      margin:0 0 25px;
      color:#75656d;
      line-height:1.5;
    }

    label{
      display:block;
      margin:18px 0 8px;
      font-weight:600;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:13px 14px;
      border:1px solid #ead9e1;
      border-radius:11px;
      background:#fff;
      font:inherit;
      color:#2b2026;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    /* CATEGORÍAS */

    .service-category{
      margin-top:10px;
      border:1px solid #ead9e1;
      border-radius:13px;
      overflow:hidden;
      background:#fff;
    }

    .category-button{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px;
      border:0;
      background:#fff;
      color:#2b2026;
      font-size:16px;
      font-weight:700;
      text-align:left;
      cursor:pointer;
    }

    .category-button span{
      font-size:22px;
      line-height:1;
    }

    .category-services{
      display:none;
      padding:0 10px 10px;
    }

    .category-services.open{
      display:block;
    }

    /* SERVICIOS */

    .service-option{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top:6px;
      padding:13px 12px;
      border:1px solid transparent;
      border-radius:10px;
      background:#fff7fa;
      color:#2b2026;
      font:inherit;
      text-align:left;
      cursor:pointer;
    }

    .service-option:hover{
      background:#fff0f5;
    }

    .service-option.selected{
      border-color:#e6a9c2;
      background:#fff0f5;
    }

    .service-option strong{
      white-space:nowrap;
    }

    .selected-service{
      margin-top:13px;
      padding:13px;
      border-radius:11px;
      background:#fff0f5;
      color:#633b4d;
      font-size:14px;
    }

    /* RESUMEN */

    .summary{
      margin-top:18px;
      padding:15px;
      border-radius:11px;
      background:#faf3f6;
      color:#5d4b54;
      font-size:14px;
      line-height:1.5;
    }

    /* BOTÓN */

    .submit-booking{
      width:100%;
      margin-top:20px;
      padding:15px;
      border:0;
      border-radius:12px;
      background:#2b2026;
      color:#fff;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    .submit-booking:hover{
      opacity:.92;
    }

    .note{
      margin-top:12px;
      font-size:12px;
      color:#806e77;
      line-height:1.5;
      text-align:center;
    }
  </style>
</head>

<body>

<main class="wrap">

  <div class="card">

    <h1>GabyStudio</h1>

    <p class="intro">
      Reserva tu cita seleccionando primero una categoría
      y luego el servicio que deseas.
    </p>

    <form id="reservationForm">

      <!-- SERVICIO -->

      <div class="service-picker">

        <label>Servicio</label>

        <div class="service-categories">

          <!-- DEPILACIÓN -->

          <div class="service-category">

            <button
              type="button"
              class="category-button"
            >
              ✨ Depilación
              <span>＋</span>
            </button>

            <div class="category-services">

              <button
                type="button"
                class="service-option"
                data-price="7"
                data-duration="30 min"
              >
                <span>Cejas</span>
                <strong>$7</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="3"
                data-duration="5 min"
              >
                <span>Depilación de bozo</span>
                <strong>$3</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="3"
                data-duration="10 min"
              >
                <span>Mentón</span>
                <strong>$3</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="7"
                data-duration="15 min"
              >
                <span>Depilación de axilas</span>
                <strong>$7</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="10"
                data-duration="30 min"
              >
                <span>Depilación facial</span>
                <strong>$10</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="15"
                data-duration="30 min"
              >
                <span>Media pierna</span>
                <strong>$15</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="20"
                data-duration="60 min"
              >
                <span>Pierna completa</span>
                <strong>$20</strong>
              </button>

            </div>
          </div>


          <!-- CEJAS -->

          <div class="service-category">

            <button
              type="button"
              class="category-button"
            >
              ✨ Cejas
              <span>＋</span>
            </button>

            <div class="category-services">

              <button
                type="button"
                class="service-option"
                data-price="10"
                data-duration="30 min"
              >
                <span>Epilación, diseño y pigmentación</span>
                <strong>$10</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="9"
                data-duration="30 min"
              >
                <span>Cejas + bozo</span>
                <strong>$9</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="17"
                data-duration="60 min"
              >
                <span>Laminado de cejas</span>
                <strong>$17</strong>
              </button>

            </div>
          </div>


          <!-- PESTAÑAS -->

          <div class="service-category">

            <button
              type="button"
              class="category-button"
            >
              ✨ Pestañas
              <span>＋</span>
            </button>

            <div class="category-services">

              <button
                type="button"
                class="service-option"
                data-price="10"
                data-duration="30 min"
              >
                <span>Pestañas por punto</span>
                <strong>$10</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="20"
                data-duration="90 min"
              >
                <span>Pelo a pelo clásicas</span>
                <strong>$20</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="22"
                data-duration="90 min"
              >
                <span>Efecto rímel</span>
                <strong>$22</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="25"
                data-duration="120 min"
              >
                <span>Efecto hawaiano</span>
                <strong>$25</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="25"
                data-duration="120 min"
              >
                <span>Efecto egipcio 3D</span>
                <strong>$25</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="25"
                data-duration="120 min"
              >
                <span>Efecto Aurora 4D</span>
                <strong>$25</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="23"
                data-duration="120 min"
              >
                <span>Marrones 2D</span>
                <strong>$23</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="17"
                data-duration="60 min"
              >
                <span>Lifting de pestañas</span>
                <strong>$17</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="32"
                data-duration="150 min"
              >
                <span>Volumen R</span>
                <strong>$32</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="5"
                data-duration="15 min"
              >
                <span>Remoción de pestañas</span>
                <strong>$5</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="17"
                data-duration="60 min"
              >
                <span>Retoque de pestañas</span>
                <strong>$17</strong>
              </button>

            </div>
          </div>


          <!-- FACIALES -->

          <div class="service-category">

            <button
              type="button"
              class="category-button"
            >
              ✨ Faciales y micropigmentación
              <span>＋</span>
            </button>

            <div class="category-services">

              <button
                type="button"
                class="service-option"
                data-price="20"
                data-duration="90 min"
              >
                <span>Limpieza facial profunda</span>
                <strong>$20</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="40"
                data-duration="90 min"
              >
                <span>Plasma rico en plaquetas</span>
                <strong>$40</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="8"
                data-duration="30 min"
              >
                <span>Cauterización de acrocordones (desde)</span>
                <strong>$8</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="65"
                data-duration="120 min"
              >
                <span>Micropigmentación de cejas</span>
                <strong>$65</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="65"
                data-duration="120 min"
              >
                <span>Microblading de cejas</span>
                <strong>$65</strong>
              </button>

              <button
                type="button"
                class="service-option"
                data-price="65"
                data-duration="120 min"
              >
                <span>Micropigmentación de labios</span>
                <strong>$65</strong>
              </button>

            </div>
          </div>

        </div>

        <input
          type="hidden"
          id="service"
          name="service"
        >

        <div
          id="selectedService"
          class="selected-service"
        >
          Selecciona un servicio
        </div>

      </div>


      <!-- FECHA -->

      <label>
        Fecha deseada

        <input
          type="date"
          id="date"
          name="date"
          required
        >
      </label>


      <!-- HORA -->

      <label>
        Hora deseada

        <select
          id="time"
          name="time"
          required
        >
          <option value="">
            Selecciona una hora
          </option>
        </select>

      </label>


      <!-- NOMBRE -->

      <label>
        Nombre completo

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Tu nombre y apellido"
          required
          maxlength="100"
        >
      </label>


      <!-- TELÉFONO -->

      <label>
        Teléfono / WhatsApp

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Tu número de contacto"
          required
          maxlength="30"
        >
      </label>


      <!-- EMAIL -->

      <label>
        Correo (opcional)

        <input
          type="email"
          id="email"
          name="email"
          placeholder="tu@email.com"
          maxlength="120"
        >
      </label>


      <!-- NOTAS -->

      <label>
        Notas (opcional)

        <textarea
          id="notes"
          name="notes"
          placeholder="Alguna información adicional"
        ></textarea>
      </label>


      <!-- RESUMEN -->

      <div
        id="bookingSummary"
        class="summary"
      >
        Selecciona un servicio para ver el resumen de tu solicitud.
      </div>


      <!-- BOTÓN -->

      <button
        class="submit-booking"
        type="submit"
      >
        Solicitar cita por WhatsApp ↗
      </button>

      <p class="note">
        La solicitud queda pendiente hasta que GabyStudio confirme
        la disponibilidad.
      </p>

    </form>

  </div>

</main>


<script>

  /* =========================
     ELEMENTOS
  ========================= */

  const form =
    document.getElementById("reservationForm");

  const service =
    document.getElementById("service");

  const date =
    document.getElementById("date");

  const time =
    document.getElementById("time");

  const summary =
    document.getElementById("bookingSummary");

  const selectedService =
    document.getElementById("selectedService");

  const wa =
    "584242087674";


  /* =========================
     FECHA MÍNIMA
  ========================= */

  const today = new Date();

  today.setMinutes(
    today.getMinutes() -
    today.getTimezoneOffset()
  );

  date.min =
    today.toISOString().slice(0,10);


  /* =========================
     HORARIOS
  ========================= */

  for(let h = 9; h < 18; h++){

    for(const m of [0,30]){

      /*
        No mostrar 5:30 p. m.
      */

      if(h === 17 && m === 30){
        continue;
      }

      const value =
        String(h).padStart(2,"0") +
        ":" +
        String(m).padStart(2,"0");

      const option =
        document.createElement("option");

      option.value = value;

      const hour12 =
        h % 12 || 12;

      option.textContent =
        hour12 +
        ":" +
        String(m).padStart(2,"0") +
        " " +
        (h < 12 ? "a. m." : "p. m.");

      time.appendChild(option);
    }
  }


  /* =========================
     DOMINGOS
  ========================= */

  date.addEventListener("change", () => {

    if(!date.value){
      return;
    }

    const d =
      new Date(
        date.value + "T12:00:00"
      );

    if(d.getDay() === 0){

      date.setCustomValidity(
        "GabyStudio no atiende los domingos. Elige otro día."
      );

      date.reportValidity();

      date.value = "";

    }else{

      date.setCustomValidity("");

    }

  });


  /* =========================
     CATEGORÍAS
  ========================= */

  document
    .querySelectorAll(".category-button")
    .forEach(button => {

      button.addEventListener("click", () => {

        const category =
          button.parentElement;

        const services =
          category.querySelector(
            ".category-services"
          );

        const icon =
          button.querySelector("span");

        const isOpen =
          services.classList.contains("open");


        /*
          Cerrar todas
        */

        document
          .querySelectorAll(".category-services")
          .forEach(item => {

            item.classList.remove("open");

          });


        document
          .querySelectorAll(".category-button span")
          .forEach(item => {

            item.textContent = "＋";

          });


        /*
          Abrir la seleccionada
        */

        if(!isOpen){

          services.classList.add("open");

          icon.textContent = "−";

        }

      });

    });


  /* =========================
     SELECCIONAR SERVICIO
  ========================= */

  document
    .querySelectorAll(".service-option")
    .forEach(button => {

      button.addEventListener("click", () => {

        const nameElement =
          button.querySelector("span");

        const serviceName =
          nameElement.textContent.trim();

        const price =
          button.dataset.price;

        const duration =
          button.dataset.duration;


        /*
          Guardar servicio
        */

        service.value =
          serviceName;


        /*
          Mostrar selección
        */

        selectedService.textContent =
          "✓ " +
          serviceName +
          " — $" +
          price +
          " · " +
          duration;


        /*
          Quitar selección anterior
        */

        document
          .querySelectorAll(".service-option")
          .forEach(item => {

            item.classList.remove("selected");

          });


        /*
          Marcar seleccionado
        */

        button.classList.add("selected");


        /*
          Actualizar resumen
        */

        summary.textContent =
          "Servicio: " +
          serviceName +
          " · Precio: $" +
          price +
          " USD · Duración estimada: " +
          duration;


        /*
          Cerrar categorías
        */

        document
          .querySelectorAll(".category-services")
          .forEach(item => {

            item.classList.remove("open");

          });


        document
          .querySelectorAll(".category-button span")
          .forEach(item => {

            item.textContent = "＋";

          });

      });

    });


  /* =========================
     ENVÍO
  ========================= */

  form.addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();


      /*
        Verificar servicio
      */

      if(!service.value){

        alert(
          "Selecciona un servicio antes de continuar."
        );

        return;

      }


      /*
        Verificar formulario
      */

      if(!form.reportValidity()){

        return;

      }


      /*
        Obtener servicio seleccionado
      */

      const selectedButton =
        document.querySelector(
          ".service-option.selected"
        );


      if(!selectedButton){

        alert(
          "Selecciona un servicio antes de continuar."
        );

        return;

      }


      /* =========================
         DATOS DE RESERVA
      ========================= */

      const reserva = {

        servicio:
          service.value,

        precio:
          Number(
            selectedButton.dataset.price
          ),

        fecha:
          date.value,

        hora:
          time.value,

        nombre:
          document
            .getElementById("name")
            .value,

        telefono:
          document
            .getElementById("phone")
            .value,

        email:
          document
            .getElementById("email")
            .value ||
          null,

        notas:
          document
            .getElementById("notes")
            .value ||
          null,

        estado:
          "pendiente"

      };


      /* =========================
         SUPABASE
      ========================= */

      const SUPABASE_URL =
        "https://srabrfcodvmgzezilpex.supabase.co";


      /*
        IMPORTANTE:
        coloca aquí tu clave anon/public.
      */

      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyYWJyZmNvZHZtZ3plemlscGV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNjczMzIsImV4cCI6MjEwNjc0MzMzMn0.1x5ASVNHJyqqmGai8pLbjoNlifUScUkxuNmhvZxRels";


      try{

        const respuesta =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/reservas",
            {
              method:"POST",

              headers:{

                "apikey":
                  SUPABASE_ANON_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_ANON_KEY,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=minimal"

              },

              body:
                JSON.stringify(reserva)

            }
          );


        if(!respuesta.ok){

          throw new Error(
            await respuesta.text()
          );

        }


        /* =========================
           FECHA PARA WHATSAPP
        ========================= */

        const prettyDate =
          new Date(
            date.value +
            "T12:00:00"
          ).toLocaleDateString(
            "es-VE",
            {
              weekday:"long",
              year:"numeric",
              month:"long",
              day:"numeric"
            }
          );


        /* =========================
           MENSAJE WHATSAPP
        ========================= */

        const msg = [

          "Hola, GabyStudio. Quiero solicitar una cita:",

          "",

          "Servicio: " +
            reserva.servicio,

          "Precio publicado: $" +
            reserva.precio +
            " USD",

          "Fecha deseada: " +
            prettyDate,

          "Hora deseada: " +
            time.options[
              time.selectedIndex
            ].text,

          "Nombre: " +
            reserva.nombre,

          "Teléfono: " +
            reserva.telefono,

          "Correo: " +
            (
              reserva.email ||
              "No indicado"
            ),

          "Notas: " +
            (
              reserva.notas ||
              "Ninguna"
            ),

          "",

          "Entiendo que la cita queda pendiente hasta que me confirmen disponibilidad."

        ].join("\n");


        /* =========================
           ABRIR WHATSAPP
        ========================= */

        window.open(
          "https://wa.me/" +
          wa +
          "?text=" +
          encodeURIComponent(msg),
          "_blank",
          "noopener"
        );


      }catch(error){

        console.error(
          "ERROR:",
          error
        );

        alert(
          "No se pudo guardar la solicitud. Inténtalo nuevamente."
        );

      }

    }
  );

</script>

</body>
</html>
