<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GabyStudio | La belleza es un arte</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#fdf8f6;
color:#3d3033;
}

.container{width:min(920px,92%);margin:auto}

/* PORTADA */
.hero{
text-align:center;
padding:38px 20px 42px;
background:linear-gradient(180deg,#f8e4e8 0%,#fdf8f6 100%);
}

.logo{
width:145px;height:145px;margin:auto;border-radius:50%;
display:flex;align-items:center;justify-content:center;
border:3px solid #c9a18b;background:#fffaf8;
box-shadow:0 6px 20px rgba(100,60,60,.12);
overflow:hidden;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
display:block
}

.hero h1{
margin:18px 0 5px;
font-family:Georgia,serif;
color:#a85f72;
font-size:34px;
}

.tagline{
margin:0;
font-family:Georgia,serif;
font-style:italic;
color:#8b6b68;
font-size:17px;
}

/* PRESENTACIÓN */
.about{
width:min(920px,92%);
margin:-15px auto 30px;
background:#fff;
border-radius:22px;
padding:28px;
box-shadow:0 8px 30px rgba(80,50,50,.10);
display:grid;
grid-template-columns:280px 1fr;
gap:28px;
align-items:center;
}

.about-photo{
width:100%;
height:330px;
object-fit:cover;
object-position:center top;
border-radius:18px;
display:block;
}

.about h2,.gallery-title{
font-family:Georgia,serif;
color:#a85f72;
margin:0 0 10px;
}

.about p{
color:#77686a;
line-height:1.7;
margin:0;
}

/* GALERÍA */
.gallery{
width:min(920px,92%);
margin:0 auto 45px;
}

.gallery-title{
text-align:center;
font-size:28px;
margin-bottom:8px
}

.gallery-intro{
text-align:center;
color:#77686a;
margin:0 0 20px
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.gallery-item{
position:relative;
overflow:hidden;
border-radius:16px;
background:#f3e3e5;
box-shadow:0 6px 20px rgba(80,50,50,.10);
}

.gallery-item img{
width:100%;
height:270px;
object-fit:cover;
display:block;
transition:transform .3s ease;
}

.gallery-item:hover img{
transform:scale(1.04)
}

.gallery-caption{
position:absolute;
left:0;
right:0;
bottom:0;
padding:10px;
color:#fff;
background:linear-gradient(transparent,rgba(45,25,30,.7));
font-size:13px;
}

/* CONTENIDO */
.card{
background:white;
margin:25px auto 45px;
padding:28px;
border-radius:20px;
box-shadow:0 8px 30px rgba(80,50,50,.10);
}

h2{
text-align:center;
font-family:Georgia,serif;
color:#a85f72;
margin-top:0;
}

.intro{
text-align:center;
color:#77686a;
line-height:1.6;
margin-bottom:25px;
}

/* FORMULARIO */
.form-group{
margin-bottom:18px
}

label{
display:block;
margin-bottom:7px;
font-weight:bold;
color:#59484b;
}

input,textarea{
width:100%;
padding:13px 14px;
border:1px solid #dfcfd0;
border-radius:10px;
font-size:15px;
background:#fffdfc;
color:#3d3033;
outline:none;
}

input:focus,textarea:focus{
border-color:#b9798a;
box-shadow:0 0 0 3px rgba(185,121,138,.12);
}

textarea{
min-height:90px;
resize:vertical
}

/* SERVICIOS */
.service-picker label{
margin-bottom:10px
}

.service-category{
margin-top:10px;
border:1px solid #e2cfd1;
border-radius:13px;
overflow:hidden;
background:#fffafa;
}

.category-button{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 16px;
border:0;
background:#f9e8eb;
color:#704d55;
font-size:15px;
font-weight:bold;
cursor:pointer;
text-align:left;
}

.category-button span{
font-size:21px;
color:#a85f72
}

.category-services{
display:none;
padding:7px 10px 10px;
background:#fff
}

.category-services.open{
display:block
}

.service-option{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:13px 12px;
margin-top:6px;
border:1px solid transparent;
border-radius:9px;
background:#faf5f4;
color:#4b3d40;
text-align:left;
cursor:pointer;
font-size:14px;
}

.service-option:hover{
border-color:#d9b4bb
}

.service-option.selected{
background:#f3dce1;
border-color:#b9798a
}

.service-option strong{
white-space:nowrap;
color:#a85f72
}

.selected-service{
margin-top:12px;
padding:12px;
border-radius:10px;
background:#f8eef0;
color:#75555c;
font-size:14px;
}

/* BOTÓN */
.submit-button{
width:100%;
padding:15px;
margin-top:10px;
border:0;
border-radius:12px;
background:#a85f72;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.submit-button:hover{
background:#914f61
}

/* RESUMEN */
.summary{
margin-top:18px;
padding:15px;
border-radius:12px;
background:#faf1f2;
border:1px solid #ead7da;
font-size:14
